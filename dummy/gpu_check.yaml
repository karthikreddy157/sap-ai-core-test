apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: gpu-test-service
  annotations:
    executables.ai.sap.com/name: gpu-test-service
  labels:
    scenarios.ai.sap.com/id: "gpu-test-scenario"
    ai.sap.com/version: "1.0"
spec:
  template: 
    apiVersion: serving.kserve.io/v1beta1
    kind: GpuTestService
    metadata:
      name: gpu-test-service
    spec: |
      predictor:
        imagePullSecrets:
          - name: saartha-ai
        containers:
          - name: kserve-container
            image: "docker.io/karthikatsaartha/cuda-health-service:0.0.1"
            command:
              - /bin/sh
              - -c
            args:
              - uvicorn app.app:app --host 0.0.0.0 --port 9000
            ports:
              - containerPort: 9000
                protocol: TCP
