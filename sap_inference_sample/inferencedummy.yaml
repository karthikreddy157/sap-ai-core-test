apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: image-inference-serving
  annotations:
    executables.ai.sap.com/name: image-inference
  labels:
    scenarios.ai.sap.com/id: "inference-scenario"
    ai.sap.com/version: "1.0"
spec:
  template: 
    apiVersion: serving.kserve.io/v1beta1
    kind: InferenceService
    metadata:
      name: image-inference
    spec: |
      predictor:
        imagePullSecrets:
          - name: saartha-aws
        containers:
          - name: kserve-container
            image: "087486675679.dkr.ecr.ap-south-1.amazonaws.com/saartha/ai-inference:1.0.63"
            command:
              - /bin/sh
              - -c
            args:
              - uvicorn main:app --host 0.0.0.0 --port 8001
            ports:
              - containerPort: 8001
                protocol: TCP
            env:
              - name: DB_SERVICE 
                value: "https://saargateway.c-5c1c2b8.kyma.ondemand.com/api/aibackend"
